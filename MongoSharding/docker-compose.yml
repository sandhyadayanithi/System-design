services:

  configsvr:
    image: mongo:7.0
    container_name: configsvr
    command: mongod --configsvr --replSet configReplSet --port 27019
    volumes:
      - configdb:/data/db

  shard1:
    image: mongo:7.0
    container_name: shard1
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018
    ports:
      - "27018:27018"
    volumes:
      - shard1db:/data/db

  shard2:
    image: mongo:7.0
    container_name: shard2
    command: mongod --shardsvr --replSet shard2ReplSet --port 27020
    ports:
      - "27020:27020"
    volumes:
      - shard2db:/data/db

  mongos:
    image: mongo:7.0
    container_name: mongos
    depends_on:
      - configsvr
      - shard1
      - shard2
    command: mongos --configdb configReplSet/configsvr:27019 --bind_ip_all

volumes:
  configdb:
  shard1db:
  shard2db: