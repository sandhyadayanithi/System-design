# Option A — self-contained: the app plus its own dedicated Redis.
#
# NOTE: this creates a container named "autocomplete-redis". If you already have a
# standalone container with that name, either remove it first
# (docker rm -f autocomplete-redis) or use docker-compose.external-redis.yml instead.
services:
  redis:
    image: redis:7-alpine
    container_name: autocomplete-redis
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - autocomplete-net

  app:
    build: .
    container_name: autocomplete-app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_TTL_SECONDS: "300"
    ports:
      - "8080:8080"
    networks:
      - autocomplete-net

networks:
  autocomplete-net:
    driver: bridge
